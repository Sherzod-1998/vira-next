<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c9a84c"/>
      <stop offset="100%" stop-color="#7b5e2a"/>
    </linearGradient>
    <clipPath id="circle-clip">
      <circle cx="50" cy="50" r="50"/>
    </clipPath>
  </defs>
  <!-- Background -->
  <circle cx="50" cy="50" r="50" fill="url(#bg)"/>
  <!-- Subtle inner highlight -->
  <circle cx="50" cy="50" r="50" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
  <!-- Head -->
  <circle cx="50" cy="36" r="16" fill="rgba(255,255,255,0.92)" clip-path="url(#circle-clip)"/>
  <!-- Body -->
  <path d="M8,100 Q8,62 50,62 Q92,62 92,100 Z" fill="rgba(255,255,255,0.92)" clip-path="url(#circle-clip)"/>
</svg>
