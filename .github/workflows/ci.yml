name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint

      - name: Type-check
        run: npx tsc --noEmit

      - name: Unit tests
        run: yarn test --ci

      - name: Build
        run: yarn build
        env:
          REACT_APP_API_URL: https://api.uzvira.uz
          REACT_APP_API_GRAPHQL_URL: https://api.uzvira.uz/graphql
          REACT_APP_API_WS: wss://api.uzvira.uz
          NEXT_PUBLIC_CHAT_WS_URL: wss://api.uzvira.uz
